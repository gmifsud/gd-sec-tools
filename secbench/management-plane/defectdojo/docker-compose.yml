# DefectDojo — Tier 2 management plane (derived from upstream docker-compose.yml; diff against the pinned release
# on every tag bump). Images come from ../images.env (generated by scripts/pin-images.sh); secrets from ./.env.
#   docker compose --env-file ../images.env --env-file .env up -d
name: secbench-defectdojo

x-dd-env: &dd-env
  DD_DEBUG: "False"
  DD_DJANGO_METRICS_ENABLED: "False"
  DD_ALLOWED_HOSTS: "*"
  DD_DATABASE_URL: "postgresql://${DD_DATABASE_USER}:${DD_DATABASE_PASSWORD}@postgres:5432/${DD_DATABASE_NAME}"
  DD_CELERY_BROKER_URL: "redis://redis:6379/0"
  DD_SECRET_KEY: "${DD_SECRET_KEY}"
  DD_CREDENTIAL_AES_256_KEY: "${DD_CREDENTIAL_AES_256_KEY}"
  DD_SITE_URL: "http://127.0.0.1:8080"
  # Dedupe tuning for secbench SARIF (normaliser guarantees fingerprints["secbench/v1"]):
  DD_DEDUPLICATION_ALGORITHM_PER_PARSER: '{"SARIF": "unique_id_from_tool_or_hash_code", "ZAP Scan": "hash_code"}'
  DD_HASHCODE_FIELDS_PER_SCANNER: '{"SARIF": ["title", "severity", "file_path", "line", "cwe"], "ZAP Scan": ["title", "cwe", "endpoints"]}'

services:
  nginx:
    image: ${IMAGE_DD_NGINX}
    depends_on: [uwsgi]
    environment:
      NGINX_METRICS_ENABLED: "false"
      DD_UWSGI_HOST: uwsgi
      DD_UWSGI_PORT: "3031"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - defectdojo_media:/usr/share/nginx/html/media:ro
    restart: unless-stopped

  uwsgi:
    image: ${IMAGE_DD_DJANGO}
    depends_on: [postgres, redis]
    entrypoint: ["/wait-for-it.sh", "postgres:5432", "-t", "30", "--", "/entrypoint-uwsgi.sh"]
    environment: *dd-env
    volumes:
      - defectdojo_media:/app/media
    restart: unless-stopped

  celerybeat:
    image: ${IMAGE_DD_DJANGO}
    depends_on: [postgres, redis]
    entrypoint: ["/wait-for-it.sh", "postgres:5432", "-t", "30", "--", "/entrypoint-celery-beat.sh"]
    environment: *dd-env
    restart: unless-stopped

  celeryworker:
    image: ${IMAGE_DD_DJANGO}
    depends_on: [postgres, redis]
    entrypoint: ["/wait-for-it.sh", "postgres:5432", "-t", "30", "--", "/entrypoint-celery-worker.sh"]
    environment: *dd-env
    volumes:
      - defectdojo_media:/app/media
    restart: unless-stopped

  initializer:
    image: ${IMAGE_DD_DJANGO}
    depends_on: [postgres]
    entrypoint: ["/wait-for-it.sh", "postgres:5432", "--", "/entrypoint-initializer.sh"]
    environment:
      <<: *dd-env
      DD_ADMIN_USER: "${DD_ADMIN_USER:-admin}"
      DD_ADMIN_MAIL: "${DD_ADMIN_MAIL:-admin@localhost}"
      DD_ADMIN_FIRST_NAME: "Admin"
      DD_ADMIN_LAST_NAME: "User"
      DD_ADMIN_PASSWORD: "${DD_ADMIN_PASSWORD}"
      DD_INITIALIZE: "${DD_INITIALIZE:-true}"

  postgres:
    image: ${IMAGE_POSTGRES}
    environment:
      POSTGRES_DB: "${DD_DATABASE_NAME}"
      POSTGRES_USER: "${DD_DATABASE_USER}"
      POSTGRES_PASSWORD: "${DD_DATABASE_PASSWORD}"
    volumes:
      - defectdojo_postgres:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: ${IMAGE_REDIS}
    volumes:
      - defectdojo_redis:/data
    restart: unless-stopped

volumes:
  defectdojo_postgres: {}
  defectdojo_media: {}
  defectdojo_redis: {}
